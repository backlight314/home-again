<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --stamp: #9c3b2e;
    --sage: #697a5c;
    --display: "Petrona", "Iowan Old Style", Georgia, serif;
    --type: "Courier Prime", "Courier New", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --page-bg: #cfc6b2;
    --page-text: #2d2722;
    --page-soft: #5e564a;
    --card: #faf5e8;
    --card-edge: #a89c84;
    --field: #fffdf7;
    --mine: #23344f;
    --mine-text: #f3eddf;
    --accent: var(--stamp);
    --done: var(--sage);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #1c1915; --page-text: #e9e1d0; --page-soft: #a79d89; --card: #2a251f; --card-edge: #534a3c; --field: #221e19;
      --mine: #3a4a66; --mine-text: #f3eddf; --accent: #d77a6a; --done: #9bb08a;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #1c1915; --page-text: #e9e1d0; --page-soft: #a79d89; --card: #2a251f; --card-edge: #534a3c; --field: #221e19;
    --mine: #3a4a66; --mine-text: #f3eddf; --accent: #d77a6a; --done: #9bb08a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--page-bg); color: var(--page-text); font-family: var(--sans); line-height: 1.5; }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; max-width: 1120px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 10px; }
  header h1 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4vw, 32px); line-height: 1.1; }
  header .links { display: flex; gap: 16px; font-family: var(--type); font-size: 14px; }
  header .links a, header .links button { color: var(--page-soft); text-decoration: underline; }

  .main { display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 0 16px calc(12px + env(safe-area-inset-bottom, 0px)); min-height: 0; }
  @media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; } }

  /* conversation */
  .chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; background: var(--card); border: 1px solid var(--card-edge); }
  .log, .composer { min-width: 0; }
  .log { overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: min(560px, 88%); display: grid; gap: 6px; }
  .msg .who { font-family: var(--type); font-size: 12px; letter-spacing: .1em; color: var(--page-soft); }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.guide .body { font-family: var(--display); font-size: 19px; line-height: 1.45; }
  .msg.family { align-self: flex-end; justify-items: end; }
  .msg.family .body { background: var(--mine); color: var(--mine-text); padding: 10px 14px; font-size: 16px; }
  .msg .att { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .msg .att img { width: 140px; height: 105px; object-fit: cover; border: 6px solid var(--field); box-shadow: 0 2px 6px rgba(40,30,15,.25); }
  .msg .att audio { width: 240px; max-width: 100%; }
  .msg.err .body { color: var(--accent); font-family: var(--type); font-size: 14px; }
  .typing { display: flex; gap: 5px; padding: 8px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--page-soft); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* composer */
  .composer { border-top: 1px solid var(--card-edge); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .tray { display: flex; flex-wrap: wrap; gap: 8px; }
  .tray:empty { display: none; }
  .chip { position: relative; display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--card-edge); padding: 4px; }
  .chip img { width: 56px; height: 42px; object-fit: cover; display: block; }
  .chip audio { width: 200px; height: 32px; }
  .chip .x { width: 24px; height: 24px; font-size: 18px; line-height: 1; color: var(--page-soft); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; min-width: 0; resize: none; min-height: 44px; max-height: 180px; background: var(--field); border: 1px solid var(--card-edge); padding: 10px 12px; font-size: 16px; color: var(--page-text); }
  .tool { height: 44px; min-width: 44px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--card-edge); background: var(--field); font-family: var(--type); font-size: 13px; }
  .tool svg { width: 20px; height: 20px; flex: none; }
  .tool.live { border-color: var(--accent); color: var(--accent); }
  .tool.send { background: var(--mine); color: var(--mine-text); border-color: var(--mine); }
  .tool:disabled { opacity: .45; cursor: default; }
  .tool .lbl { display: inline; }
  @media (max-width: 520px) { .tool .lbl { display: none; } }
  .hidden-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  /* what the guide has gathered */
  aside { display: grid; gap: 14px; align-content: start; overflow-y: auto; min-height: 0; }
  .panel { background: var(--card); border: 1px solid var(--card-edge); padding: 14px; display: grid; gap: 10px; }
  .panel h2 { font-family: var(--type); font-size: 12px; letter-spacing: .12em; color: var(--page-soft); font-weight: 700; }
  .check { list-style: none; display: grid; gap: 6px; font-size: 15px; }
  .check li { display: flex; align-items: center; gap: 8px; }
  .check .box { width: 16px; height: 16px; border: 1.5px solid var(--card-edge); flex: none; display: grid; place-items: center; }
  .check li.done .box { background: var(--done); border-color: var(--done); }
  .check li.done .box::after { content: ""; width: 8px; height: 4px; border-left: 2px solid var(--card); border-bottom: 2px solid var(--card); transform: rotate(-45deg) translate(1px, -1px); }
  .check .n { margin-left: auto; font-family: var(--type); font-size: 12px; color: var(--page-soft); }
  .play { display: block; text-align: center; font-family: var(--type); font-weight: 700; letter-spacing: .04em; padding: 10px; border: 2px solid var(--accent); color: var(--accent); text-decoration: none; }
  .play[hidden] { display: none; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
  .thumbs img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .people { font-size: 14px; color: var(--page-soft); }
  /* on phones: a compact checklist above the conversation */
  @media (max-width: 820px) {
    aside { order: -1; overflow: visible; }
    .panel { padding: 8px 10px; gap: 6px; }
    .panel h2 { display: none; }
    .panel.saved { display: none; }
    .check { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
    .check .n { margin-left: 0; }
    .play { padding: 6px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Family Workshop</h1>
    <div class="links"><button id="newChat">new conversation</button><a href="/">open the game</a></div>
  </header>

  <div class="main">
    <section class="chat" aria-label="Conversation with the guide">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="composer">
        <div class="tray" id="tray"></div>
        <div class="row">
          <button class="tool" id="photoBtn" title="Add photos" aria-label="Add photos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span class="lbl">Photo</span>
          </button>
          <input type="file" id="photoInput" class="hidden-input" accept="image/*" multiple tabindex="-1">
          <button class="tool" id="micBtn" title="Record a voice message" aria-label="Record a voice message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="lbl" id="micLbl">Voice</span>
          </button>
          <textarea id="input" rows="1" placeholder="Write to the guide" aria-label="Your message"></textarea>
          <button class="tool send" id="sendBtn" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </section>

    <aside>
      <div class="panel">
        <h2>FOR THE GAME</h2>
        <ul class="check" id="check"></ul>
        <a class="play" id="play" href="/" hidden>PLAY THE GAME</a>
      </div>
      <div class="panel saved">
        <h2>SHARED SO FAR</h2>
        <div class="people" id="people"></div>
        <div class="thumbs" id="thumbs"></div>
      </div>
    </aside>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  let photos = [], voice = null, busy = false;

  async function api(method, url, body) {
    const res = await fetch(url, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  /* conversation log */
  function addMessage(role, text, attachments = []) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    const who = role === 'guide' ? 'GUIDE' : role === 'family' ? 'YOU' : '';
    const att = attachments.map(a => a.kind === 'photo'
      ? `<img src="${esc(a.url)}" alt="shared photo">`
      : `<audio controls preload="none" src="${esc(a.url)}"></audio>`).join('');
    el.innerHTML = (who ? `<span class="who">${who}</span>` : '') +
      (att ? `<div class="att">${att}</div>` : '') +
      (text ? `<div class="body">${esc(text)}</div>` : '');
    $('log').appendChild(el);
    $('log').scrollTop = $('log').scrollHeight;
  }
  function typing(on) {
    $('typing')?.remove();
    if (!on) return;
    const el = document.createElement('div');
    el.className = 'msg guide'; el.id = 'typing';
    el.innerHTML = '<span class="who">GUIDE</span><div class="typing" aria-label="The guide is writing"><i></i><i></i><i></i></div>';
    $('log').appendChild(el);
    $('log').scrollTop = $('log').scrollHeight;
  }

  /* gathered so far */
  function showState({ progress, materials }) {
    $('check').innerHTML = progress.items.map(i =>
      `<li class="${i.done ? 'done' : ''}"><span class="box"></span>${esc(i.label)}${i.count ? `<span class="n">${i.count}</span>` : ''}</li>`).join('');
    $('play').hidden = !progress.built;
    $('people').textContent = materials.people.length
      ? materials.people.map(f => f.name + (f.relation ? ' (' + f.relation + ')' : '')).join(', ')
      : 'Nobody yet.';
    $('thumbs').innerHTML = materials.photos.map(p => `<img src="${esc(p.url)}" alt="${esc(p.caption)}" title="${esc(p.caption)}">`).join('');
  }

  /* sending */
  async function send(extra = {}) {
    if (busy) return;
    const text = $('input').value.trim();
    if (!extra.start && !text && !photos.length && !voice) return;
    busy = true; setBusy();
    const body = { text, photos: photos.map(p => p.dataUrl), voice: voice?.dataUrl || null, ...extra };
    if (!extra.start) {
      addMessage('family', text, [...photos.map(p => ({ kind: 'photo', url: p.dataUrl })), ...(voice ? [{ kind: 'voice', url: voice.url }] : [])]);
      $('input').value = ''; autosize();
      photos = []; voice = null; drawTray();
    }
    typing(true);
    try {
      const r = await api('POST', '/api/chat', body);
      typing(false);
      addMessage('guide', r.reply);
      showState(r);
    } catch (err) {
      typing(false);
      addMessage('err', err.message);
    } finally { busy = false; setBusy(); $('input').focus(); }
  }
  function setBusy() { $('sendBtn').disabled = busy; }
  $('sendBtn').onclick = () => send();
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 180) + 'px'; }
  $('input').addEventListener('input', autosize);

  /* attachments waiting to be sent */
  function drawTray() {
    $('tray').innerHTML = photos.map((p, i) => `<span class="chip"><img src="${p.dataUrl}" alt=""><button class="x" data-photo="${i}" aria-label="Remove photo">&times;</button></span>`).join('') +
      (voice ? `<span class="chip"><audio controls src="${voice.url}"></audio><button class="x" data-voice aria-label="Remove recording">&times;</button></span>` : '');
  }
  $('tray').onclick = e => {
    if (e.target.dataset.photo !== undefined) photos.splice(+e.target.dataset.photo, 1);
    else if (e.target.dataset.voice !== undefined) voice = null;
    else return;
    drawTray();
  };

  // Shrinks photos before upload so requests stay small.
  function shrinkImage(file, max = 1280) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error("Couldn't open " + file.name + '. Try a JPEG or PNG.'));
      img.src = URL.createObjectURL(file);
    });
  }
  $('photoBtn').onclick = () => $('photoInput').click();
  $('photoInput').onchange = async () => {
    for (const file of $('photoInput').files) {
      try { photos.push({ dataUrl: await shrinkImage(file) }); }
      catch (err) { addMessage('err', err.message); }
    }
    $('photoInput').value = '';
    drawTray(); $('input').focus();
  };

  // Gemini can't hear the WebM that browsers record, so recordings are re-encoded
  // as 16 kHz mono WAV, which is plenty for speech and plays everywhere.
  async function toWav(blob) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
    ctx.close();
    const rate = 16000, length = Math.ceil(decoded.duration * rate);
    const offline = new OfflineAudioContext(1, length, rate);
    const src = offline.createBufferSource();
    src.buffer = decoded; src.connect(offline.destination); src.start();
    const samples = (await offline.startRendering()).getChannelData(0);
    const view = new DataView(new ArrayBuffer(44 + samples.length * 2));
    const str = (o, s) => [...s].forEach((c, i) => view.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVEfmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    str(36, 'data'); view.setUint32(40, samples.length * 2, true);
    samples.forEach((v, i) => view.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 0x7fff, true));
    return new Blob([view], { type: 'audio/wav' });
  }

  // Records in the browser; the guide listens to the audio itself.
  let recorder = null, recTimer = null;
  $('micBtn').onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { return addMessage('err', 'The browser could not use the microphone. Check its permission and try again.'); }
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(recTimer);
      const type = recorder.mimeType.split(';')[0] || 'audio/webm';
      recorder = null;
      $('micBtn').classList.remove('live'); $('micLbl').textContent = 'Voice';
      try {
        const wav = await toWav(new Blob(chunks, { type }));
        const reader = new FileReader();
        reader.onload = () => { voice = { dataUrl: reader.result, url: URL.createObjectURL(wav) }; drawTray(); };
        reader.readAsDataURL(wav);
      } catch { addMessage('err', "That recording couldn't be read. Please try again."); }
    };
    recorder.start();
    const started = Date.now();
    $('micBtn').classList.add('live');
    const tick = () => { const s = Math.floor((Date.now() - started) / 1000); $('micLbl').textContent = 'Stop ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    tick(); recTimer = setInterval(tick, 500);
  };

  $('newChat').onclick = async () => {
    if (busy || !confirm('Start a new conversation? Everything already shared stays saved.')) return;
    await api('POST', '/api/chat/reset');
    $('log').innerHTML = '';
    send({ start: true });
  };

  (async () => {
    try {
      const r = await api('GET', '/api/chat');
      showState(r);
      r.transcript.forEach(m => addMessage(m.role, m.text, m.attachments));
      if (!r.transcript.length) send({ start: true });
    } catch {
      addMessage('err', 'Start the server with "npm start" and open this page from it.');
    }
  })();
</script>
</body>
</html>
